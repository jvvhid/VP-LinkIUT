<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Feed</title>
</head>
<body>
<div layout:fragment="content">

    <!-- Page Header -->
    <div class="mb-8 animate-fade-in">
        <h1 class="text-3xl font-bold bg-gradient-to-r from-white to-surface-200 bg-clip-text text-transparent">Opportunity Feed</h1>
        <p class="text-surface-200/60 mt-1">Discover jobs, internships, and mentorship from IUT alumni</p>
    </div>

    <!-- ═══ Post Opportunity Form ═══ -->
    <div class="glass rounded-2xl p-6 mb-8 animate-fade-in-up stagger-1" style="opacity:0">
        <div class="flex items-center gap-3 mb-5">
            <div th:if="${currentUser}" class="w-10 h-10 rounded-full bg-gradient-to-br from-brand-500 to-accent-teal flex items-center justify-center text-sm font-bold text-white">
                <span th:text="${currentUser.initials}">U</span>
            </div>
            <h2 class="text-lg font-semibold text-white">Share an Opportunity</h2>
        </div>
        <form hx-post="/opportunities" hx-target="#opportunity-feed" hx-swap="afterbegin" hx-on::after-request="this.reset()">
            <div class="space-y-4">
                <input type="text" name="title" placeholder="Opportunity title..."
                       class="input-glass w-full rounded-xl px-4 py-3 text-sm" required id="opp-title">
                <textarea name="description" placeholder="Describe the opportunity..."
                          class="input-glass w-full rounded-xl px-4 py-3 text-sm h-24 resize-none" required id="opp-description"></textarea>
                <div class="flex items-center gap-4">
                    <select name="type" class="input-glass rounded-xl px-4 py-3 text-sm flex-1" id="opp-type">
                        <option th:each="t : ${types}" th:value="${t}" th:text="${t}">JOB</option>
                    </select>
                    <button type="submit" class="btn-primary px-6 py-3 rounded-xl text-sm font-semibold flex items-center gap-2" id="opp-submit">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                        Post
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- ═══ Opportunity Feed (HTMX auto-refresh) ═══ -->
    <div id="opportunity-feed"
         hx-get="/opportunities/list"
         hx-trigger="every 30s"
         hx-swap="innerHTML"
         class="space-y-5">

        <!-- Fragment: opportunity-list -->
        <th:block th:fragment="opportunity-list">
            <div th:each="opp, iter : ${opportunities}"
                 th:fragment="opportunity-card"
                 class="glass hover-lift rounded-2xl p-6 animate-fade-in-up"
                 th:style="'opacity:0; animation-delay:' + ${iter.index * 0.1} + 's'"
                 th:id="'opp-' + ${opp.id}">

                <!-- Card Header -->
                <div class="flex items-start justify-between mb-4">
                    <div class="flex items-center gap-3">
                        <a th:href="@{/profile/{id}(id=${opp.postedBy.id})}"
                           class="w-11 h-11 rounded-full bg-gradient-to-br from-brand-500 to-accent-violet flex items-center justify-center text-sm font-bold text-white hover:shadow-lg hover:shadow-brand-500/20 transition-shadow">
                            <span th:text="${opp.postedBy.initials}">FR</span>
                        </a>
                        <div>
                            <a th:href="@{/profile/{id}(id=${opp.postedBy.id})}" class="text-sm font-semibold text-white hover:text-brand-400 transition-colors" th:text="${opp.postedBy.displayName}">User Name</a>
                            <div class="flex items-center gap-2 mt-0.5">
                                <span class="inline-block text-[10px] px-2 py-0.5 rounded-full font-semibold"
                                      th:classappend="${opp.postedBy.role.name() == 'ALUMNI' ? 'badge-alumni' : 'badge-student'}"
                                      th:text="${opp.postedBy.role}">ALUMNI</span>
                                <span class="text-xs text-surface-200/40" th:text="${opp.timeAgo}">2h ago</span>
                            </div>
                        </div>
                    </div>
                    <span class="text-[11px] px-3 py-1 rounded-full font-semibold"
                          th:classappend="${opp.typeBadgeClass}"
                          th:text="${opp.type}">JOB</span>
                </div>

                <!-- Card Body -->
                <h3 class="text-lg font-semibold text-white mb-2" th:text="${opp.title}">Opportunity Title</h3>
                <p class="text-sm text-surface-200/70 leading-relaxed mb-4" th:text="${opp.description}">Description goes here...</p>

                <!-- Card Footer -->
                <div class="flex items-center justify-between pt-4 border-t border-white/5">
                    <div class="flex items-center gap-2 text-xs text-surface-200/40">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        <span th:if="${opp.expiresAt}" th:text="'Expires ' + ${#temporals.format(opp.expiresAt, 'MMM d, yyyy')}">Expires Jan 1</span>
                    </div>
                    <a th:href="@{/messages/start/{id}(id=${opp.postedBy.id})}"
                       th:if="${currentUser != null && !currentUser.id.equals(opp.postedBy.id)}"
                       class="text-xs text-brand-400 hover:text-brand-300 font-medium flex items-center gap-1 transition-colors">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
                        Message
                    </a>
                </div>
            </div>

            <!-- Empty State -->
            <div th:if="${#lists.isEmpty(opportunities)}" class="glass rounded-2xl p-12 text-center">
                <svg class="w-16 h-16 mx-auto mb-4 text-surface-200/20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" /></svg>
                <p class="text-surface-200/40 text-sm">No opportunities yet. Be the first to share one!</p>
            </div>
        </th:block>
    </div>

</div>
</body>
</html>
