<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Feed</title>
</head>
<body>
<div layout:fragment="content">

    <!-- Professional Tech/Sci-Fi Graphics -->
    <div class="pointer-events-none fixed inset-0 z-[-1] overflow-hidden">
        <!-- Subtle dot grid pattern over dark background -->
        <div class="absolute inset-0 bg-[#060b13]/50"></div>
        <svg class="absolute top-0 left-0 w-full h-full text-[#38bdf8]/[0.03]" viewBox="0 0 100 100" preserveAspectRatio="none">
            <pattern id="dot-grid" x="0" y="0" width="1" height="1" patternUnits="userSpaceOnUse">
                <circle cx="0.5" cy="0.5" r="0.1" fill="currentColor"/>
            </pattern>
            <rect width="100" height="100" fill="url(#dot-grid)"/>
        </svg>
        
        <!-- Glowing corner accents -->
        <div class="absolute -top-40 -right-40 w-96 h-96 bg-[#0ea5e9] opacity-[0.05] blur-[100px] rounded-full"></div>
        <div class="absolute top-1/3 -left-40 w-96 h-96 bg-[#10b981] opacity-[0.03] blur-[100px] rounded-full"></div>
        
        <!-- Abstract Tech Lines -->
        <svg class="absolute top-20 right-10 w-[300px] h-[300px] text-[#0ea5e9]/[0.05]" viewBox="0 0 300 300" fill="none">
            <path d="M 50 0 L 50 150 L 150 250 L 300 250" stroke="currentColor" stroke-width="1"/>
            <path d="M 80 0 L 80 140 L 180 240 L 300 240" stroke="currentColor" stroke-width="0.5"/>
            <circle cx="150" cy="250" r="3" fill="currentColor"/>
        </svg>
    </div>

    <div class="relative z-10 max-w-3xl mx-auto">
        <!-- Page Header -->
        <div class="mb-8 animate-fade-in">
            <div class="flex items-center gap-3 mb-2">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#0ea5e9]/10 to-[#10b981]/10 border border-[#0ea5e9]/20 flex items-center justify-center">
                    <svg class="w-5 h-5 text-[#38bdf8]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" /></svg>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-white tracking-wide">Network Feed</h1>
                    <p class="text-[13px] text-surface-200/50">Discover opportunities, insights, and journeys from the IUT community.</p>
                </div>
            </div>
        </div>

        <!-- ═══ Filter Tabs ═══ -->
        <div class="flex items-center gap-2 mb-2 overflow-x-auto pb-2 animate-fade-in scrollbar-hide" id="main-tabs">
            <button onclick="filterOpportunities('ALL', false)" class="main-tab active text-xs px-5 py-2 rounded-lg font-medium transition-all whitespace-nowrap uppercase tracking-wider" data-type="ALL">All</button>
            <button onclick="filterOpportunities('OPPORTUNITY', false)" class="main-tab text-xs px-5 py-2 rounded-lg font-medium transition-all whitespace-nowrap uppercase tracking-wider" data-type="OPPORTUNITY">Opportunity</button>
            <button onclick="filterOpportunities('JOURNEY', false)" class="main-tab text-xs px-5 py-2 rounded-lg font-medium transition-all whitespace-nowrap uppercase tracking-wider" data-type="JOURNEY">Journey</button>
        </div>

        <div id="sub-tabs" class="hidden flex items-center gap-2 mb-6 overflow-x-auto pb-2 animate-fade-in scrollbar-hide">
            <button onclick="filterOpportunities('JOB', true)" class="sub-tab text-xs px-4 py-1.5 rounded-full font-medium transition-all whitespace-nowrap border border-white/10 text-slate-400 hover:text-white" data-type="JOB">Jobs</button>
            <button onclick="filterOpportunities('INTERNSHIP', true)" class="sub-tab text-xs px-4 py-1.5 rounded-full font-medium transition-all whitespace-nowrap border border-white/10 text-slate-400 hover:text-white" data-type="INTERNSHIP">Internships</button>
            <button onclick="filterOpportunities('RESEARCH_CONTRIBUTION', true)" class="sub-tab text-xs px-4 py-1.5 rounded-full font-medium transition-all whitespace-nowrap border border-white/10 text-slate-400 hover:text-white" data-type="RESEARCH_CONTRIBUTION">Research Contribution</button>
        </div>

        <!-- ═══ Post Opportunity Form (Minimized) ═══ -->
        <div class="bg-[#0b111a] border border-[#0ea5e9]/10 rounded-2xl p-4 mb-8 animate-fade-in-up stagger-1 shadow-[0_0_15px_rgba(0,0,0,0.4)]" style="opacity:0" id="post-box-container">
            <div class="flex items-center gap-3 cursor-text" onclick="togglePostBox()">
                <div th:if="${currentUser}" class="w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold text-black overflow-hidden flex-shrink-0 bg-gradient-to-br from-[#38bdf8] to-[#10b981]">
                    <img th:if="${currentUser.avatarUrl != null}" th:src="${currentUser.avatarUrl}" alt="Avatar" class="w-full h-full object-cover"/>
                    <span th:if="${currentUser.avatarUrl == null}" th:text="${currentUser.initials}">U</span>
                </div>
                <div class="flex-1 bg-[#131b26] border border-white/5 rounded-full px-4 py-2.5 text-[13px] text-surface-200/40 hover:border-[#0ea5e9]/30 transition-colors">
                    Share an opportunity, insight, or app build...
                </div>
            </div>
            
            <div id="post-box-expanded" class="hidden mt-4 pt-4 border-t border-white/5 animate-fade-in">
                <form hx-post="/opportunities" hx-target="#opportunity-feed" hx-swap="afterbegin" hx-on::after-request="this.reset(); togglePostBox(); showToast('Posted to network!', 'success')">
                    <div class="space-y-4">
                        <input type="text" name="title" placeholder="Title..."
                               class="w-full rounded-xl px-4 py-3 text-sm bg-[#131b26] border border-white/10 text-white focus:border-[#38bdf8] focus:ring-1 focus:ring-[#38bdf8] outline-none" required id="opp-title">
                        <textarea name="description" placeholder="Share details..."
                                  class="w-full rounded-xl px-4 py-3 text-sm h-24 resize-none bg-[#131b26] border border-white/10 text-white focus:border-[#38bdf8] focus:ring-1 focus:ring-[#38bdf8] outline-none" required id="opp-description"></textarea>
                        
                        <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4">
                            <select name="type" class="rounded-xl px-4 py-3 text-sm flex-1 w-full sm:w-auto bg-[#131b26] border border-white/10 text-white outline-none" id="opp-type">
                                <option value="JOB">Job</option>
                                <option value="INTERNSHIP">Internship</option>
                                <option value="RESEARCH_CONTRIBUTION">Research Contribution</option>
                                <option value="JOURNEY">Journey</option>
                            </select>
                            
                            <select name="archiveInHours" class="rounded-xl px-4 py-3 text-sm flex-1 w-full sm:w-auto bg-[#131b26] border border-white/10 text-white outline-none" id="opp-archive">
                                <option value="">No Auto-Archive</option>
                                <option value="24">Archive after 24 hours</option>
                                <option value="48">Archive after 48 hours</option>
                                <option value="168">Archive after 1 week</option>
                            </select>
                            
                            <div class="flex items-center gap-2 w-full sm:w-auto mt-2 sm:mt-0 justify-end">
                                <button type="button" class="px-4 py-2 text-[13px] text-surface-200/50 hover:text-white transition-colors" onclick="togglePostBox()">Cancel</button>
                                <button type="submit" class="px-6 py-2.5 rounded-xl text-[13px] font-semibold flex items-center gap-2 bg-[#38bdf8]/10 text-[#38bdf8] border border-[#38bdf8]/20 hover:bg-[#38bdf8]/20 transition-all" id="opp-submit">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                                    Publish
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <script>
            function togglePostBox() {
                const expanded = document.getElementById('post-box-expanded');
                if (expanded.classList.contains('hidden')) {
                    expanded.classList.remove('hidden');
                    document.getElementById('opp-title').focus();
                } else {
                    expanded.classList.add('hidden');
                }
            }
        </script>

        <!-- ═══ Opportunity Feed (HTMX auto-refresh) ═══ -->
        <div id="opportunity-feed"
             hx-get="/opportunities/list"
             hx-trigger="every 30s"
             hx-swap="innerHTML"
             class="space-y-5">

            <!-- Fragment: opportunity-list -->
            <th:block th:fragment="opportunity-list">
                <div th:each="opp, iter : ${opportunities}"
                     th:fragment="opportunity-card"
                     class="bg-[#0b111a] border border-[#0ea5e9]/10 rounded-2xl p-6 animate-fade-in-up opp-card relative overflow-hidden transition-all hover:border-[#0ea5e9]/30 hover:shadow-[0_4px_20px_rgba(14,165,233,0.1)]"
                     th:style="'opacity:0; animation-delay:' + ${iter.index * 0.1} + 's'"
                     th:id="'opp-' + ${opp.id}"
                     th:data-type="${opp.type}">

                    <!-- Card Header -->
                    <div class="flex items-start justify-between mb-5">
                        <div class="flex items-center gap-3">
                            <a th:href="@{/profile/{id}(id=${opp.postedBy.id})}"
                               class="w-11 h-11 rounded-full flex items-center justify-center text-sm font-bold text-white border border-white/10 overflow-hidden flex-shrink-0 relative z-10 bg-gradient-to-br from-[#38bdf8] to-[#10b981]">
                                <img th:if="${opp.postedBy.avatarUrl != null}" th:src="${opp.postedBy.avatarUrl}" alt="Avatar" class="w-full h-full object-cover"/>
                                <span th:if="${opp.postedBy.avatarUrl == null}" th:text="${opp.postedBy.initials}">FR</span>
                            </a>
                            <div>
                                <a th:href="@{/profile/{id}(id=${opp.postedBy.id})}" class="text-[14px] font-semibold text-[#f8fafc] hover:text-[#38bdf8] transition-colors" th:text="${opp.postedBy.displayName}">User Name</a>
                                <div class="flex items-center gap-2 mt-0.5">
                                    <span class="inline-block text-[9px] uppercase tracking-wider px-2 py-0.5 rounded border border-[#38bdf8]/30 text-[#38bdf8] bg-[#38bdf8]/5 font-semibold"
                                          th:text="${opp.postedBy.profile != null and opp.postedBy.profile.department != null and opp.postedBy.profile.batch != null ? (opp.postedBy.profile.department + '-' + opp.postedBy.profile.batch) : opp.postedBy.role}">ALUMNI</span>
                                    <span class="text-[11px] text-[#94a3b8]/60" th:text="${opp.timeAgo}">2h ago</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="flex items-center gap-2 relative z-10">
                            <!-- ARCHIVED Tag -->
                            <span th:if="${opp.isArchived()}" class="text-[10px] px-2 py-1 rounded bg-[#0f172a] text-[#64748b] border border-[#1e293b] font-bold uppercase tracking-wider flex items-center gap-1">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" /></svg>
                                Archived
                            </span>
                            
                            <!-- Badges for types -->
                            <span th:if="${!opp.isArchived()}" class="text-[10px] px-2.5 py-1 rounded-full font-bold tracking-wide uppercase border border-current/20"
                                  th:classappend="${opp.type.name() == 'JOB' ? 'text-[#38bdf8] bg-[#38bdf8]/10' : 
                                                  (opp.type.name() == 'INTERNSHIP' ? 'text-[#10b981] bg-[#10b981]/10' : 
                                                  (opp.type.name() == 'RESEARCH_CONTRIBUTION' ? 'text-[#a855f7] bg-[#a855f7]/10' : 
                                                  (opp.type.name() == 'JOURNEY' ? 'text-[#f59e0b] bg-[#f59e0b]/10' : 'text-[#6366f1] bg-[#6366f1]/10')))}"
                                  th:text="${opp.type.name() == 'RESEARCH_CONTRIBUTION' ? 'RESEARCH' : opp.type}">JOB</span>
                        </div>
                    </div>

                    <!-- Card Body -->
                    <h3 class="text-base font-semibold text-[#f1f5f9] mb-2" th:classappend="${opp.isArchived() ? 'opacity-50' : ''}" th:text="${opp.title}">Opportunity Title</h3>
                    
                    <th:block th:if="${!opp.isArchived()}">
                        <p class="text-[13px] text-[#94a3b8] leading-relaxed mb-5" th:text="${opp.description}">Description goes here...</p>

                        <!-- Card Footer -->
                        <div class="flex items-center justify-between pt-4 border-t border-[#1e293b] relative z-10">
                            
                            <!-- View Profile Button -->
                            <a th:href="@{/profile/{id}(id=${opp.postedBy.id})}" class="text-[12px] text-[#94a3b8] hover:text-[#f8fafc] font-medium flex items-center gap-1.5 transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                                View Profile
                            </a>
                            
                            <div class="flex items-center gap-4">
                                <!-- Text Author Button -->
                                <form th:if="${currentUser != null && !currentUser.id.equals(opp.postedBy.id)}"
                                      th:action="@{/messages/start/{id}(id=${opp.postedBy.id})}" method="post" class="inline">
                                    <button type="submit" class="text-[12px] text-[#38bdf8] hover:text-[#0ea5e9] font-medium flex items-center gap-1.5 transition-colors bg-[#38bdf8]/10 hover:bg-[#38bdf8]/20 px-3 py-1.5 rounded-lg border border-[#38bdf8]/20 cursor-pointer">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
                                        Text author
                                    </button>
                                </form>
                            </div>
                        </div>
                    </th:block>
                    <th:block th:if="${opp.isArchived()}">
                        <!-- Archived overlay pattern -->
                        <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSJ0cmFuc3BhcmVudCI+PC9yZWN0Pgo8cGF0aCBkPSJNMCAwTDIgMloiIHN0cm9rZT0icmdiYSgyNTUsIDI1NSwgMjU1LCAwLjAzKSIgc3Ryb2tlLXdpZHRoPSIxIj48L3BhdGg+Cjwvc3ZnPg==')] opacity-50 z-0 pointer-events-none"></div>
                    </th:block>
                </div>

                <!-- Empty State -->
                <div th:if="${#lists.isEmpty(opportunities)}" class="bg-[#0b111a] border border-[#1e293b] rounded-2xl p-12 text-center shadow-inner">
                    <div class="w-16 h-16 mx-auto mb-4 rounded-xl bg-[#1e293b]/50 border border-white/5 flex items-center justify-center">
                        <svg class="w-8 h-8 text-[#94a3b8]/40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" /></svg>
                    </div>
                    <p class="text-[#94a3b8] text-[13px] mb-1">Network feed is clear.</p>
                    <p class="text-[#64748b] text-[12px]">Broadcast an opportunity to begin.</p>
                </div>
            </th:block>
        </div>
    </div>

    <script>
        function filterOpportunities(type, isSubTab = false) {
            if (!isSubTab) {
                document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
                event.target.classList.add('active');

                const subTabs = document.getElementById('sub-tabs');
                if (type === 'OPPORTUNITY') {
                    subTabs.classList.remove('hidden');
                    document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
                } else {
                    subTabs.classList.add('hidden');
                }
            } else {
                document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
                event.target.classList.add('active');
            }

            document.querySelectorAll('.opp-card').forEach(card => {
                const cardType = card.dataset.type;
                let show = false;
                
                if (type === 'ALL') {
                    show = true;
                } else if (type === 'JOURNEY') {
                    show = (cardType === 'JOURNEY');
                } else if (type === 'OPPORTUNITY') {
                    show = (cardType === 'JOB' || cardType === 'INTERNSHIP' || cardType === 'RESEARCH_CONTRIBUTION');
                } else if (isSubTab) {
                    show = (cardType === type);
                }

                if (show) {
                    card.style.display = '';
                    setTimeout(() => card.style.opacity = '1', 50);
                } else {
                    card.style.opacity = '0';
                    setTimeout(() => card.style.display = 'none', 200);
                }
            });
        }
    </script>
    <style>
        .main-tab { background: rgba(30,41,59,0.3); color: rgba(148,163,184,0.8); border: 1px solid rgba(255,255,255,0.05); }
        .main-tab:hover { background: rgba(56,189,248,0.1); color: #f8fafc; border-color: rgba(56,189,248,0.2); }
        .main-tab.active { background: rgba(56,189,248,0.15); color: #38bdf8; border-color: rgba(56,189,248,0.3); }
        .sub-tab:hover { background: rgba(255,255,255,0.05); }
        .sub-tab.active { background: rgba(255,255,255,0.1); color: white; border-color: rgba(255,255,255,0.3); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

</div>
</body>
</html>
