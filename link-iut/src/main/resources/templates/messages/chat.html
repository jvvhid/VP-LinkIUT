<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Messages - LinkIUT</title>
</head>
<body>
<div layout:fragment="content">

    <!-- Professional Sci-Fi Styles -->
    <style>
        .cyber-chat-bg {
            background-color: #080c10;
            background-image: linear-gradient(to right, #ffffff05 1px, transparent 1px),
                              linear-gradient(to bottom, #ffffff05 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .cyber-bubble-sent {
            background-color: rgba(0, 255, 204, 0.1);
            border: 1px solid rgba(0, 255, 204, 0.3);
            color: #e0f2f1;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.05);
        }
        .cyber-bubble-received {
            background-color: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
        }
        .cyber-tail-sent {
            border-top-right-radius: 2px !important;
        }
        .cyber-tail-received {
            border-top-left-radius: 2px !important;
        }
        
        /* Typing indicator dots */
        .typing-dots span {
            animation: blink 1.4s infinite both;
            height: 4px;
            width: 4px;
            background: #00ffcc;
            border-radius: 50%;
            display: inline-block;
            margin: 0 1px;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink {
            0% { opacity: 0.2; transform: scale(0.8); }
            20% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.2; transform: scale(0.8); }
        }
    </style>

    <div class="flex h-[calc(100vh-5rem)] lg:h-[calc(100vh-2rem)] gap-6 animate-fade-in" id="chat-wrapper">

        <!-- ═══ Session List (Left Panel) ═══ -->
        <div class="hidden md:flex flex-col w-80 rounded-2xl overflow-hidden bg-[#0d131a] border border-white/10 shadow-[0_0_20px_rgba(0,0,0,0.5)] z-20">
            <div class="p-5 border-b border-white/5 bg-[#141b22]">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-lg font-bold text-white flex items-center gap-2">
                        <svg class="w-5 h-5 text-[#00ffcc]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
                        Network COM
                    </h2>
                </div>
                <a href="/search" class="w-full py-2 rounded-lg bg-[#1e293b] text-white/70 text-[13px] font-semibold flex items-center justify-center gap-2 hover:bg-[#00ffcc]/20 hover:text-[#00ffcc] transition-colors border border-white/10 hover:border-[#00ffcc]/50">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                    Find someone to text
                </a>
            </div>
            <div class="flex-1 overflow-y-auto space-y-0 relative">
                <th:block th:if="${chatSessions != null && !chatSessions.isEmpty()}">
                    <a th:each="cs : ${chatSessions}"
                       th:href="@{/messages/{id}(id=${cs.id})}"
                       class="flex items-center gap-4 px-4 py-3 hover:bg-[#1a232b] transition-all group border-b border-white/5"
                       th:classappend="${activeChat != null && activeChat.id == cs.id ? 'bg-[#1a232b] border-l-2 border-l-[#00ffcc]' : 'border-l-2 border-l-transparent'}">
                        <div class="relative">
                            <div class="w-12 h-12 rounded-full flex items-center justify-center text-xs font-bold text-white overflow-hidden border border-[#00ffcc]/30 shadow-[0_0_10px_rgba(0,255,204,0.1)] relative">
                                <img th:if="${cs.getOtherParticipant(currentUser.id).avatarUrl != null}"
                                     th:src="${cs.getOtherParticipant(currentUser.id).avatarUrl}" alt="" class="w-full h-full object-cover"/>
                                <div th:if="${cs.getOtherParticipant(currentUser.id).avatarUrl == null}"
                                     class="w-full h-full bg-gradient-to-br from-[#00ffcc] to-[#0088ff] flex items-center justify-center">
                                    <span th:text="${cs.getOtherParticipant(currentUser.id).initials}">U</span>
                                </div>
                            </div>
                            <!-- Unread Indicator Dot -->
                            <div th:if="${unreadSessions != null && unreadSessions.contains(cs.id)}" class="absolute top-0 right-0 w-3 h-3 bg-red-500 rounded-full border-2 border-[#1a232b]"></div>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-[14px] font-medium text-white truncate group-hover:text-[#00ffcc] transition-colors" th:text="${cs.getOtherParticipant(currentUser.id).displayName}">User</p>
                            <p class="text-[12px] text-surface-200/50 truncate">Secured connection</p>
                        </div>
                    </a>
                </th:block>

                <!-- Empty State -->
                <div th:if="${chatSessions == null || chatSessions.isEmpty()}" class="flex flex-col items-center justify-center h-full text-center px-4">
                    <p class="text-sm text-surface-200/40">No active links</p>
                </div>
            </div>
        </div>

        <!-- ═══ Chat Area (Right Panel) ═══ -->
        <div class="flex-1 rounded-2xl flex flex-col overflow-hidden border border-white/10 relative bg-[#0d131a] shadow-[0_0_20px_rgba(0,0,0,0.5)] z-20">

            <!-- ── Active Chat View ── -->
            <th:block th:if="${activeChat != null}">
                <!-- Chat Header -->
                <div class="flex items-center justify-between px-4 py-3 bg-[#141b22] z-10 shadow-sm border-b border-[#00ffcc]/20">
                    <div class="flex items-center gap-4">
                        <a th:href="@{/profile/{id}(id=${activeChat.getOtherParticipant(currentUser.id).id})}"
                           class="w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold text-white hover:opacity-80 transition-opacity overflow-hidden border border-[#00ffcc]/30 shadow-[0_0_10px_rgba(0,255,204,0.1)]">
                            <img th:if="${activeChat.getOtherParticipant(currentUser.id).avatarUrl != null}"
                                 th:src="${activeChat.getOtherParticipant(currentUser.id).avatarUrl}" alt="" class="w-full h-full object-cover"/>
                            <div th:if="${activeChat.getOtherParticipant(currentUser.id).avatarUrl == null}"
                                 class="w-full h-full bg-gradient-to-br from-[#00ffcc] to-[#0088ff] flex items-center justify-center">
                                <span th:text="${activeChat.getOtherParticipant(currentUser.id).initials}">U</span>
                            </div>
                        </a>
                        <div>
                            <p class="text-[15px] font-medium text-white shadow-[#00ffcc]" th:text="${activeChat.getOtherParticipant(currentUser.id).displayName}">User Name</p>
                            <p class="text-[11px] text-[#00ffcc]/80 tracking-wide font-mono">
                                <!-- Show Batch & Dept if available -->
                                <th:block th:if="${activeChat.getOtherParticipant(currentUser.id).profile != null && activeChat.getOtherParticipant(currentUser.id).profile.batch != null}">
                                    <span th:text="${activeChat.getOtherParticipant(currentUser.id).profile.department != null ? activeChat.getOtherParticipant(currentUser.id).profile.department + '-' : ''}"></span><span th:text="${activeChat.getOtherParticipant(currentUser.id).profile.batch}"></span>
                                    <span class="opacity-50 mx-1">|</span>
                                </th:block>
                                <span th:text="${activeChat.getOtherParticipant(currentUser.id).role}">ALUMNI</span>
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Messages Area -->
                <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 cyber-chat-bg">
                    <!-- Render existing messages -->
                    <th:block th:if="${chatMessages != null}">
                        <th:block th:each="msg : ${chatMessages}">
                            <div class="flex" th:classappend="${msg.sender.id == currentUser.id ? 'justify-end' : 'justify-start'}">
                                <div class="max-w-[75%] rounded-[10px] px-3 pt-2 pb-2.5 relative shadow-sm"
                                     th:classappend="${msg.sender.id == currentUser.id ? 'cyber-bubble-sent cyber-tail-sent' : 'cyber-bubble-received cyber-tail-received'}">
                                    <div class="text-[14px] leading-snug whitespace-pre-wrap pr-16 pb-1" th:text="${msg.content}">Message text</div>
                                    <div class="text-[10px] absolute bottom-1 right-2 flex items-center gap-1 opacity-70"
                                         th:classappend="${msg.sender.id == currentUser.id ? 'text-[#00ffcc]' : 'text-surface-200/50'}">
                                        <span th:text="${msg.formattedTime}">12:00</span>
                                        <th:block th:if="${msg.sender.id == currentUser.id}">
                                            <!-- Status icons -->
                                            <svg th:if="${msg.status.name() == 'SENT'}" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
                                            <svg th:if="${msg.status.name() == 'DELIVERED'}" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7M5 18l4 4L19 12" /></svg>
                                            <svg th:if="${msg.status.name() == 'SEEN'}" class="w-3 h-3 text-[#33a8ff]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7M5 18l4 4L19 12" /></svg>
                                        </th:block>
                                    </div>
                                </div>
                            </div>
                        </th:block>
                    </th:block>

                    <!-- HTMX polling for new messages -->
                    <div id="new-messages-area"
                         th:hx-get="@{/messages/{id}/poll(id=${activeChat.id}, lastId=${lastMessageId})}"
                         hx-trigger="every 3s"
                         hx-swap="outerHTML"
                         th:hx-vals="'{}'">
                    </div>
                </div>

                <!-- Message Input -->
                <div class="px-4 py-3 bg-[#141b22] border-t border-white/10">
                    <form class="flex items-center gap-3 relative"
                          th:hx-post="@{/messages/{id}/send(id=${activeChat.id})}"
                          hx-target="#new-messages-area"
                          hx-swap="outerHTML"
                          hx-on::after-request="this.reset(); scrollChat();">
                          
                        <!-- Typing indicator overlay that appears when sending -->
                        <div id="typing-indicator" class="htmx-indicator absolute -top-8 left-4 bg-[#1e293b] px-3 py-1 rounded-full text-xs text-[#00ffcc] flex items-center gap-2 border border-[#00ffcc]/20 shadow-[0_0_10px_rgba(0,255,204,0.1)]">
                            Sending <div class="typing-dots"><span></span><span></span><span></span></div>
                        </div>

                        <input type="text" name="content" placeholder="Transmit message..."
                               class="flex-1 rounded-xl px-4 py-2.5 text-[14px] bg-[#0d131a] text-white border border-white/10 focus:border-[#00ffcc]/50 focus:outline-none focus:ring-1 focus:ring-[#00ffcc]/50 transition-all placeholder-white/20" required autocomplete="off" id="msg-input">
                        <button type="submit" class="w-10 h-10 rounded-xl bg-gradient-to-r from-brand-500 to-[#00ffcc]/80 flex items-center justify-center hover:opacity-90 transition-opacity shadow-[0_0_15px_rgba(0,255,204,0.3)] text-black" id="msg-send">
                            <svg class="w-5 h-5 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                        </button>
                    </form>
                </div>
            </th:block>

            <!-- ── No Session Selected ── -->
            <th:block th:if="${activeChat == null}">
                <div class="flex-1 flex flex-col items-center justify-center text-center px-8 bg-[#080c10] cyber-chat-bg">
                    <div class="w-32 h-32 mb-6 text-[#00ffcc]/20 relative">
                        <!-- Sci-fi rings -->
                        <svg viewBox="0 0 100 100" class="animate-[spin_20s_linear_infinite] absolute inset-0"><circle cx="50" cy="50" r="48" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="10 5" /></svg>
                        <svg viewBox="0 0 100 100" class="animate-[spin_15s_linear_infinite_reverse] absolute inset-2"><circle cx="48" cy="48" r="40" fill="none" stroke="currentColor" stroke-width="0.5" stroke-dasharray="20 10 5 10" /></svg>
                        <div class="absolute inset-0 flex items-center justify-center text-[#00ffcc]/40">
                            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
                        </div>
                    </div>
                    <h3 class="text-xl font-bold tracking-widest uppercase text-white mb-2 shadow-[#00ffcc]">COM Channel</h3>
                    <p class="text-[13px] text-white/40 max-w-sm">Select a connection from the network to initiate a secure conversation.</p>
                </div>
            </th:block>
        </div>
    </div>

    <!-- ═══ HTMX Fragments ═══ -->
    <th:block th:if="${msg != null}">
        <th:block th:fragment="new-message-sent">
            <!-- The sent message bubble -->
            <div class="flex justify-end animate-fade-in">
                <div class="max-w-[75%] rounded-[10px] px-3 pt-2 pb-2.5 relative shadow-sm cyber-bubble-sent cyber-tail-sent">
                    <div class="text-[14px] leading-snug whitespace-pre-wrap pr-16 pb-1" th:text="${msg.content}">Message text</div>
                    <div class="text-[10px] absolute bottom-1 right-2 flex items-center gap-1 opacity-70 text-[#00ffcc]">
                        <span th:text="${msg.formattedTime}">12:00</span>
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
                    </div>
                </div>
            </div>
            <!-- Update the polling area with the new lastMessageId so it doesn't poll what we just sent -->
            <div id="new-messages-area"
                 th:hx-get="@{/messages/{id}/poll(id=${activeChat.id}, lastId=${lastMessageId})}"
                 hx-trigger="every 3s"
                 hx-swap="outerHTML"
                 th:hx-vals="'{}'">
            </div>
        </th:block>
    </th:block>

    <th:block th:if="${activeChat != null && chatMessages != null}">
        <th:block th:fragment="new-messages">
            <th:block th:each="msg : ${chatMessages}">
                <div class="flex animate-fade-in" th:classappend="${msg.sender.id == currentUser.id ? 'justify-end' : 'justify-start'}">
                    <div class="max-w-[75%] rounded-[10px] px-3 pt-2 pb-2.5 relative shadow-sm"
                         th:classappend="${msg.sender.id == currentUser.id ? 'cyber-bubble-sent cyber-tail-sent' : 'cyber-bubble-received cyber-tail-received'}">
                        <div class="text-[14px] leading-snug whitespace-pre-wrap pr-16 pb-1" th:text="${msg.content}">Message text</div>
                        <div class="text-[10px] absolute bottom-1 right-2 flex items-center gap-1 opacity-70"
                             th:classappend="${msg.sender.id == currentUser.id ? 'text-[#00ffcc]' : 'text-surface-200/50'}">
                            <span th:text="${msg.formattedTime}">12:00</span>
                            <th:block th:if="${msg.sender.id == currentUser.id}">
                                <svg th:if="${msg.status.name() == 'SENT'}" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
                                <svg th:if="${msg.status.name() == 'DELIVERED'}" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7M5 18l4 4L19 12" /></svg>
                                <svg th:if="${msg.status.name() == 'SEEN'}" class="w-3 h-3 text-[#33a8ff]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7M5 18l4 4L19 12" /></svg>
                            </th:block>
                        </div>
                    </div>
                </div>
            </th:block>
            <!-- The new polling area replaces the old one -->
            <div id="new-messages-area"
                 th:hx-get="@{/messages/{id}/poll(id=${activeChat.id}, lastId=${lastMessageId})}"
                 hx-trigger="every 3s"
                 hx-swap="outerHTML"
                 th:hx-vals="'{}'">
            </div>
            
            <script th:if="${!chatMessages.isEmpty() && chatMessages[chatMessages.size() - 1].sender.id != currentUser.id}">
                if (typeof showToast === 'function') {
                    showToast('New message received!', 'info');
                }
                scrollChat();
            </script>
        </th:block>
    </th:block>

    <!-- Scripts -->
    <script>
        function scrollChat() {
            const chatBox = document.getElementById('chat-messages');
            if (chatBox) setTimeout(() => chatBox.scrollTop = chatBox.scrollHeight, 50);
        }
        function updatePollingUrl(el) {
            scrollChat();
        }
        scrollChat();
    </script>

</div>
</body>
</html>
