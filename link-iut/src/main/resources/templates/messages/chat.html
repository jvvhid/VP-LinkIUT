<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
    <title>Messages</title>
</head>
<body>
<div layout:fragment="content">

    <div class="flex h-[calc(100vh-5rem)] lg:h-[calc(100vh-8rem)] gap-gutter animate-fade-in">

        <!-- ═══ Session List (Left Panel) ═══ -->
        <div class="hidden md:flex flex-col w-80 bg-surface border-[3px] border-on-surface shadow-isometric">
            <div class="h-14 bg-surface-variant border-b-[3px] border-on-surface flex items-center px-4">
                <h2 class="font-headline-sm text-on-surface uppercase">Conversations</h2>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-2">
                <th:block th:if="${chatSessions != null && !chatSessions.isEmpty()}">
                    <a th:each="cs : ${chatSessions}"
                       th:href="@{/messages/{id}(id=${cs.id})}"
                       class="flex items-center gap-3 p-3 border-[3px] border-on-surface hover-isometric transition-transform bg-surface"
                       th:classappend="${activeChat != null && activeChat.id == cs.id ? 'shadow-[inset_4px_4px_0px_0px_rgba(26,28,28,1)] bg-surface-container-high' : 'shadow-isometric'}">
                        
                        <div class="relative">
                            <div class="w-10 h-10 border-[3px] border-on-surface bg-primary text-on-primary flex items-center justify-center font-bold">
                                <span th:text="${cs.getOtherParticipant(currentUser.id).initials}">FR</span>
                            </div>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="font-body-md font-bold text-on-surface truncate" th:text="${cs.getOtherParticipant(currentUser.id).displayName}">User</p>
                            <p class="font-label-md text-on-surface-variant truncate">Active</p>
                        </div>
                    </a>
                </th:block>

                <!-- Empty State -->
                <div th:if="${chatSessions == null || chatSessions.isEmpty()}" class="flex flex-col items-center justify-center h-full text-center p-4 border-[3px] border-on-surface border-dashed">
                    <span class="material-symbols-outlined text-4xl text-on-surface-variant mb-2">forum</span>
                    <p class="font-body-md text-on-surface-variant">No conversations yet</p>
                </div>
            </div>
        </div>

        <!-- ═══ Chat Area (Right Panel) ═══ -->
        <div class="flex-1 flex flex-col bg-surface border-[3px] border-on-surface shadow-isometric">

            <!-- ── Active Chat View ── -->
            <th:block th:if="${activeChat != null}">
                <!-- Chat Header -->
                <div class="h-16 bg-surface-container-low border-b-[3px] border-on-surface flex items-center justify-between px-6">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 border-[3px] border-on-surface bg-primary text-on-primary flex items-center justify-center font-bold">
                            <span th:text="${activeChat.getOtherParticipant(currentUser.id).initials}">FR</span>
                        </div>
                        <div>
                            <p class="font-headline-sm text-on-surface" th:text="${activeChat.getOtherParticipant(currentUser.id).displayName}">User</p>
                            <span class="font-label-md bg-surface-variant border-[3px] border-on-surface px-2 py-0.5"
                                  th:text="${activeChat.getOtherParticipant(currentUser.id).role}">ROLE</span>
                        </div>
                    </div>
                </div>

                <!-- Messages Area -->
                <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-4 bg-background">
                    <!-- Render existing messages -->
                    <th:block th:each="msg : ${chatMessages}">
                        <div class="flex" th:classappend="${msg.sender.id == currentUser.id ? 'justify-end' : 'justify-start'}">
                            <div class="flex flex-col max-w-[75%]" th:classappend="${msg.sender.id == currentUser.id ? 'items-end' : 'items-start'}">
                                <div class="p-4 border-[3px] border-on-surface shadow-isometric"
                                     th:classappend="${msg.sender.id == currentUser.id ? 'bg-primary-container text-on-primary-container' : 'bg-surface text-on-surface'}">
                                    <p class="font-body-md" th:text="${msg.content}">Message text</p>
                                </div>
                                <span class="font-label-md text-[10px] text-on-surface-variant mt-2" th:text="${msg.formattedTime}">12:00</span>
                            </div>
                        </div>
                    </th:block>

                    <!-- HTMX WebSocket trigger for new messages -->
                    <div id="new-messages-area"
                         th:hx-get="@{/messages/{id}/poll(id=${activeChat.id}, lastId=${lastMessageId})}"
                         hx-trigger="newMessage from:body"
                         hx-swap="outerHTML">
                    </div>
                </div>

                <!-- Message Input -->
                <div class="p-4 border-t-[3px] border-on-surface bg-surface">
                    <form class="flex gap-4"
                          th:action="@{/messages/{id}/send(id=${activeChat.id})}"
                          th:hx-post="@{/messages/{id}/send(id=${activeChat.id})}"
                          hx-target="#chat-messages"
                          hx-swap="none"
                          hx-on::after-request="this.reset(); document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight">
                        <input type="text" name="content" placeholder="Type a message..."
                               class="flex-1 border-[3px] border-on-surface bg-surface-container-low p-3 font-body-md shadow-[inset_2px_2px_0px_0px_rgba(26,28,28,0.2)] focus:outline-none focus:border-primary" required autocomplete="off" id="msg-input">
                        <button type="submit" class="bg-primary text-on-primary font-headline-sm uppercase border-[3px] border-on-surface px-6 py-2 shadow-isometric hover-isometric transition-all" id="msg-send">
                            SEND
                        </button>
                    </form>
                </div>

            </th:block>

            <!-- ── No Session Selected ── -->
            <th:block th:if="${activeChat == null}">
                <div class="flex-1 flex flex-col items-center justify-center text-center p-8 bg-background">
                    <div class="w-20 h-20 border-[3px] border-on-surface bg-surface-variant flex items-center justify-center mb-6 shadow-isometric">
                        <span class="material-symbols-outlined text-4xl text-on-surface-variant">forum</span>
                    </div>
                    <h3 class="font-headline-lg text-on-surface mb-2">Select a Chat</h3>
                    <p class="font-body-md text-on-surface-variant">Choose a chat from the sidebar to start communicating.</p>
                </div>
            </th:block>
        </div>
    </div>

    <!-- ═══ HTMX Fragments (returned by controller) ═══ -->
    <th:block th:if="${false}">
        <!-- Fragment: message-bubble (for HTMX send response) -->
        <th:block th:fragment="message-bubble" th:if="${msg != null}">
            <div class="flex mt-4" th:classappend="${msg.sender.id == currentUser.id ? 'justify-end' : 'justify-start'}">
                <div class="flex flex-col max-w-[75%]" th:classappend="${msg.sender.id == currentUser.id ? 'items-end' : 'items-start'}">
                    <div class="p-4 border-[3px] border-on-surface shadow-isometric"
                         th:classappend="${msg.sender.id == currentUser.id ? 'bg-primary-container text-on-primary-container' : 'bg-surface text-on-surface'}">
                        <p class="font-body-md" th:text="${msg.content}">Message text</p>
                    </div>
                    <span class="font-label-md text-[10px] text-on-surface-variant mt-2" th:text="${msg.formattedTime}">12:00</span>
                </div>
            </div>
        </th:block>

        <!-- Fragment: new-messages-loader (returns the messages PLUS a new loader div) -->
        <th:block th:fragment="new-messages-loader" th:if="${activeChat != null}">
            <th:block th:each="msg : ${chatMessages}">
                <div class="flex mt-4" th:classappend="${msg.sender.id == currentUser.id ? 'justify-end' : 'justify-start'}">
                    <div class="flex flex-col max-w-[75%]" th:classappend="${msg.sender.id == currentUser.id ? 'items-end' : 'items-start'}">
                        <div class="p-4 border-[3px] border-on-surface shadow-isometric"
                             th:classappend="${msg.sender.id == currentUser.id ? 'bg-primary-container text-on-primary-container' : 'bg-surface text-on-surface'}">
                            <p class="font-body-md" th:text="${msg.content}">Message text</p>
                        </div>
                        <span class="font-label-md text-[10px] text-on-surface-variant mt-2" th:text="${msg.formattedTime}">12:00</span>
                    </div>
                </div>
            </th:block>
            <div id="new-messages-area"
                 th:hx-get="@{/messages/{id}/poll(id=${activeChat.id}, lastId=${lastMessageId})}"
                 hx-trigger="newMessage from:body"
                 hx-swap="outerHTML">
            </div>
        </th:block>

        <!-- Fragment: session-expired (HTMX error response) -->
        <th:block th:fragment="session-expired">
            <div class="flex justify-center mt-4">
                <div class="border-[3px] border-on-surface bg-error-container text-on-error-container px-6 py-2 font-body-md font-bold">
                    ⚠ Session expired. No new messages can be sent.
                </div>
            </div>
        </th:block>
    </th:block>

    <!-- Scripts -->
    <script th:if="${activeChat != null}">

        // Auto-scroll to bottom on load
        const chatBox = document.getElementById('chat-messages');
        if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;

        // WebSocket initialization
        (function() {
            var activeSessionId = [[${activeChat.id}]];
            var socket = new SockJS('/ws');
            var stompClient = Stomp.over(socket);
            
            // Disable STOMP debug logs in production
            stompClient.debug = null;

            stompClient.connect({}, function (frame) {
                console.log('Connected to WebSocket');
                stompClient.subscribe('/topic/chat/' + activeSessionId, function (message) {
                    // Trigger HTMX to fetch the new message by dispatching a custom event on the body
                    document.body.dispatchEvent(new Event('newMessage'));
                    // Scroll down after appending
                    setTimeout(() => {
                        const cb = document.getElementById('chat-messages');
                        if (cb) cb.scrollTop = cb.scrollHeight;
                    }, 100);
                });
            });
        })();
    </script>

</div>
</body>
</html>
