<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE — LinkIUT">LinkIUT</title>
    <meta name="description" content="LinkIUT — Premium alumni-student networking hub for IUT Dhaka">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        brand: {
                            50:  '#eef5ff',
                            100: '#d9e8ff',
                            200: '#bcd8ff',
                            300: '#8ec0ff',
                            400: '#599dff',
                            500: '#3377ff',
                            600: '#1b55f5',
                            700: '#1440e1',
                            800: '#1735b6',
                            900: '#19318f',
                            950: '#141f57',
                        },
                        surface: {
                            50:  '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            700: '#1e293b',
                            800: '#0f172a',
                            850: '#0c1222',
                            900: '#020617',
                        },
                        accent: {
                            teal:   '#2dd4bf',
                            amber:  '#fbbf24',
                            rose:   '#fb7185',
                            violet: '#a78bfa',
                        }
                    },
                    animation: {
                        'fade-in':       'fadeIn 0.5s ease-out forwards',
                        'fade-in-up':    'fadeInUp 0.6s ease-out forwards',
                        'slide-in-left': 'slideInLeft 0.4s ease-out forwards',
                        'pulse-soft':    'pulseSoft 3s ease-in-out infinite',
                        'glow':          'glow 4s ease-in-out infinite',
                        'toast-in':      'toastIn 0.4s ease-out forwards',
                        'toast-out':     'toastOut 0.3s ease-in forwards',
                    },
                    keyframes: {
                        fadeIn:       { '0%': { opacity: '0' },                                          '100%': { opacity: '1' } },
                        fadeInUp:     { '0%': { opacity: '0', transform: 'translateY(20px)' },           '100%': { opacity: '1', transform: 'translateY(0)' } },
                        slideInLeft:  { '0%': { opacity: '0', transform: 'translateX(-20px)' },          '100%': { opacity: '1', transform: 'translateX(0)' } },
                        pulseSoft:    { '0%, 100%': { opacity: '1' },                                     '50%': { opacity: '0.7' } },
                        glow:         { '0%, 100%': { boxShadow: '0 0 20px rgba(51,119,255,0.15)' },     '50%': { boxShadow: '0 0 40px rgba(51,119,255,0.3)' } },
                        toastIn:      { '0%': { opacity: '0', transform: 'translateY(20px) scale(0.95)' }, '100%': { opacity: '1', transform: 'translateY(0) scale(1)' } },
                        toastOut:     { '0%': { opacity: '1', transform: 'translateY(0)' },                '100%': { opacity: '0', transform: 'translateY(-10px)' } },
                    },
                    backdropBlur: { xs: '2px' },
                }
            }
        }
    </script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>

    <!-- Custom Styles -->
    <style>
        * { font-family: 'Inter', system-ui, sans-serif; }

        body {
            background: #020617;
            color: #e2e8f0;
            min-height: 100vh;
        }

        /* Animated gradient background orbs */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
        }
        .bg-orb-1 { width: 600px; height: 600px; background: #3377ff; top: -10%; left: -5%;  animation: drift1 20s ease-in-out infinite; }
        .bg-orb-2 { width: 500px; height: 500px; background: #2dd4bf; top: 50%;  right: -10%; animation: drift2 25s ease-in-out infinite; }
        .bg-orb-3 { width: 400px; height: 400px; background: #a78bfa; bottom: -5%; left: 30%; animation: drift3 22s ease-in-out infinite; }

        @keyframes drift1 { 0%, 100% { transform: translate(0, 0); }       50% { transform: translate(50px, 30px); } }
        @keyframes drift2 { 0%, 100% { transform: translate(0, 0); }       50% { transform: translate(-40px, -50px); } }
        @keyframes drift3 { 0%, 100% { transform: translate(0, 0); }       50% { transform: translate(30px, -40px); } }

        /* Glassmorphism card */
        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .glass-light {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Badge colors */
        .badge-job        { background: linear-gradient(135deg, #3377ff, #1b55f5); color: white; }
        .badge-internship { background: linear-gradient(135deg, #2dd4bf, #14b8a6); color: #020617; }
        .badge-mentorship { background: linear-gradient(135deg, #a78bfa, #8b5cf6); color: white; }
        .badge-student    { background: linear-gradient(135deg, #2dd4bf, #14b8a6); color: #020617; }
        .badge-alumni     { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #020617; }

        /* Smooth scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Hover lift effect */
        .hover-lift {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .hover-lift:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(51, 119, 255, 0.15);
        }

        /* Nav link */
        .nav-link {
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }
        .nav-link:hover, .nav-link.active {
            background: rgba(51, 119, 255, 0.1);
            border-left-color: #3377ff;
            color: #3377ff;
        }

        /* Staggered animation delays */
        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .stagger-4 { animation-delay: 0.4s; }
        .stagger-5 { animation-delay: 0.5s; }

        /* Input styling */
        .input-glass {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .input-glass:focus {
            outline: none;
            border-color: #3377ff;
            box-shadow: 0 0 0 3px rgba(51, 119, 255, 0.15);
        }

        /* Button primary */
        .btn-primary {
            background: linear-gradient(135deg, #3377ff, #1b55f5);
            color: white;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-primary:hover {
            box-shadow: 0 8px 25px rgba(51, 119, 255, 0.35);
            transform: translateY(-1px);
        }
        .btn-primary:active { transform: translateY(0); }

        /* Toast styles */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            pointer-events: auto;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            animation: toastIn 0.4s ease-out forwards;
        }
        .toast.success { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.25); color: #6ee7b7; }
        .toast.error   { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.25); color: #fca5a5; }
        .toast.info    { background: rgba(51, 119, 255, 0.15); border: 1px solid rgba(51, 119, 255, 0.25); color: #93c5fd; }
        .toast.removing { animation: toastOut 0.3s ease-in forwards; }

        /* Verified badge */
        .verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 9999px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
            font-weight: 600;
        }
    </style>
</head>
<body class="antialiased">
    <!-- Background Orbs -->
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <div class="relative z-10 flex min-h-screen">
        <!-- ═══ Sidebar ═══ -->
        <aside class="hidden lg:flex flex-col w-72 glass border-r border-white/5 p-6 fixed h-full">
            <!-- Logo -->
            <div class="flex items-center gap-0 -ml-2 mb-10">
                <div class="w-20 h-20 flex items-center justify-center relative hover:scale-105 transition-transform">
                    <img src="/images/justlogo.png" alt="Logo" class="w-full h-full object-contain drop-shadow-[0_0_8px_rgba(51,119,255,0.6)]" />
                </div>
                <div class="-ml-1 -mt-1 flex flex-col justify-center">
                    <h1 class="text-3xl font-bold bg-gradient-to-r from-brand-400 to-accent-teal bg-clip-text text-transparent tracking-tight leading-none">LinkIUT</h1>
                    <p class="text-[10px] text-surface-200/40 tracking-[0.2em] uppercase mt-1 pl-0.5 font-medium">Grow Together</p>
                </div>
            </div>

            <!-- Navigation -->
            <nav class="flex-1 space-y-1" id="main-nav">
                <a href="/" id="nav-feed" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm text-surface-200 hover:text-brand-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" /></svg>
                    <span>Feed</span>
                </a>
                <a href="/messages" id="nav-messages" class="nav-link flex items-center justify-between px-4 py-3 rounded-lg text-sm text-surface-200 hover:text-brand-400">
                    <div class="flex items-center gap-3">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
                        <span>Messages</span>
                    </div>
                    <div th:if="${globalHasUnreadMessages}" class="w-2 h-2 bg-red-500 rounded-full shadow-[0_0_8px_rgba(239,68,68,0.6)]"></div>
                </a>
                <a href="/search" id="nav-search" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm text-surface-200 hover:text-brand-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                    <span>Discover</span>
                </a>
                <a th:href="@{/profile/{id}(id=${currentUser?.id ?: 1})}" id="nav-profile" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm text-surface-200 hover:text-brand-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                    <span>Profile</span>
                </a>
            </nav>

            <!-- User Card -->
            <div th:if="${currentUser}" class="glass-light rounded-xl p-4 mt-auto">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold text-white overflow-hidden flex-shrink-0">
                        <img th:if="${currentUser.avatarUrl != null}" th:src="${currentUser.avatarUrl}" alt="Avatar" class="w-full h-full object-cover"/>
                        <div th:if="${currentUser.avatarUrl == null}" class="w-full h-full bg-gradient-to-br from-brand-500 to-accent-teal flex items-center justify-center">
                            <span th:text="${currentUser.initials}">FR</span>
                        </div>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-semibold truncate" th:text="${currentUser.displayName}">User</p>
                        <span class="inline-block text-[10px] px-2 py-0.5 rounded-full font-semibold mt-0.5"
                              th:classappend="${currentUser.role.name() == 'ALUMNI' ? 'badge-alumni' : 'badge-student'}"
                              th:text="${currentUser.role}">ROLE</span>
                    </div>
                    <a href="/logout" class="text-surface-200/40 hover:text-accent-rose transition-colors" title="Sign Out">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                    </a>
                </div>
            </div>
        </aside>

        <!-- ═══ Mobile Header ═══ -->
        <header class="lg:hidden fixed top-0 left-0 right-0 z-50 glass border-b border-white/5 px-4 py-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-0 -ml-2">
                    <div class="w-14 h-14 flex items-center justify-center relative">
                        <img src="/images/justlogo.png" alt="Logo" class="w-full h-full object-contain drop-shadow-[0_0_5px_rgba(51,119,255,0.6)]" />
                    </div>
                    <div class="-ml-1 -mt-1 flex flex-col justify-center">
                        <h1 class="text-2xl font-bold bg-gradient-to-r from-brand-400 to-accent-teal bg-clip-text text-transparent tracking-tight leading-none">LinkIUT</h1>
                        <p class="text-[9px] text-surface-200/40 tracking-[0.15em] uppercase mt-0.5 pl-0.5 font-medium">Grow Together</p>
                    </div>
                </div>
                <nav class="flex items-center gap-4">
                    <a href="/" class="text-surface-200/60 hover:text-brand-400 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" /></svg>
                    </a>
                    <a href="/messages" class="relative text-surface-200/60 hover:text-brand-400 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
                        <div th:if="${globalHasUnreadMessages}" class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full shadow-[0_0_8px_rgba(239,68,68,0.6)]"></div>
                    </a>
                    <a href="/search" class="text-surface-200/60 hover:text-brand-400 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                    </a>
                    <a th:href="@{/profile/{id}(id=${currentUser?.id ?: 1})}" class="text-surface-200/60 hover:text-brand-400 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                    </a>
                </nav>
            </div>
        </header>

        <!-- ═══ Main Content ═══ -->
        <main class="flex-1 lg:ml-72 pt-16 lg:pt-0">
            <div layout:fragment="content" class="p-6 lg:p-10">
                <!-- Page content injected here -->
            </div>
        </main>
    </div>

    <!-- Toast JS -->
    <script>
        function showToast(message, type) {
            type = type || 'info';
            const container = document.getElementById('toast-container');
            if (!container) return;
            const icons = {
                success: '<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>',
                error: '<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>',
                info: '<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>'
            };
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.innerHTML = (icons[type] || icons.info) + '<span>' + message + '</span>';
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('removing');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>

    <!-- Active Nav Highlight -->
    <script>
        (function() {
            const path = window.location.pathname;
            const nav = document.getElementById('main-nav');
            if (!nav) return;
            const links = nav.querySelectorAll('.nav-link');
            links.forEach(link => {
                const href = link.getAttribute('href');
                if (path === '/' && href === '/') {
                    link.classList.add('active');
                } else if (href !== '/' && path.startsWith(href)) {
                    link.classList.add('active');
                }
            });
        })();
    </script>
</body>
</html>
