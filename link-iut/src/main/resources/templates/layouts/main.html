<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE — LinkIUT">LinkIUT</title>
    <meta name="description" content="LinkIUT — Premium alumni-student networking hub for IUT Dhaka">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        brand: {
                            50:  '#eef5ff',
                            100: '#d9e8ff',
                            200: '#bcd8ff',
                            300: '#8ec0ff',
                            400: '#599dff',
                            500: '#3377ff',
                            600: '#1b55f5',
                            700: '#1440e1',
                            800: '#1735b6',
                            900: '#19318f',
                            950: '#141f57',
                        },
                        surface: {
                            50:  '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            700: '#1e293b',
                            800: '#0f172a',
                            850: '#0c1222',
                            900: '#020617',
                        },
                        accent: {
                            teal:   '#2dd4bf',
                            amber:  '#fbbf24',
                            rose:   '#fb7185',
                            violet: '#a78bfa',
                        }
                    },
                    animation: {
                        'fade-in':       'fadeIn 0.5s ease-out forwards',
                        'fade-in-up':    'fadeInUp 0.6s ease-out forwards',
                        'slide-in-left': 'slideInLeft 0.4s ease-out forwards',
                        'pulse-soft':    'pulseSoft 3s ease-in-out infinite',
                        'glow':          'glow 4s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn:       { '0%': { opacity: '0' },                                          '100%': { opacity: '1' } },
                        fadeInUp:     { '0%': { opacity: '0', transform: 'translateY(20px)' },           '100%': { opacity: '1', transform: 'translateY(0)' } },
                        slideInLeft:  { '0%': { opacity: '0', transform: 'translateX(-20px)' },          '100%': { opacity: '1', transform: 'translateX(0)' } },
                        pulseSoft:    { '0%, 100%': { opacity: '1' },                                     '50%': { opacity: '0.7' } },
                        glow:         { '0%, 100%': { boxShadow: '0 0 20px rgba(51,119,255,0.15)' },     '50%': { boxShadow: '0 0 40px rgba(51,119,255,0.3)' } },
                    },
                    backdropBlur: { xs: '2px' },
                }
            }
        }
    </script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>

    <!-- Custom Styles -->
    <style>
        * { font-family: 'Inter', system-ui, sans-serif; }

        body {
            background: #020617;
            color: #e2e8f0;
            min-height: 100vh;
        }

        /* Animated gradient background orbs */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
        }
        .bg-orb-1 { width: 600px; height: 600px; background: #3377ff; top: -10%; left: -5%;  animation: drift1 20s ease-in-out infinite; }
        .bg-orb-2 { width: 500px; height: 500px; background: #2dd4bf; top: 50%;  right: -10%; animation: drift2 25s ease-in-out infinite; }
        .bg-orb-3 { width: 400px; height: 400px; background: #a78bfa; bottom: -5%; left: 30%; animation: drift3 22s ease-in-out infinite; }

        @keyframes drift1 { 0%, 100% { transform: translate(0, 0); }       50% { transform: translate(50px, 30px); } }
        @keyframes drift2 { 0%, 100% { transform: translate(0, 0); }       50% { transform: translate(-40px, -50px); } }
        @keyframes drift3 { 0%, 100% { transform: translate(0, 0); }       50% { transform: translate(30px, -40px); } }

        /* Glassmorphism card */
        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .glass-light {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Badge colors */
        .badge-job        { background: linear-gradient(135deg, #3377ff, #1b55f5); color: white; }
        .badge-internship { background: linear-gradient(135deg, #2dd4bf, #14b8a6); color: #020617; }
        .badge-mentorship { background: linear-gradient(135deg, #a78bfa, #8b5cf6); color: white; }
        .badge-student    { background: linear-gradient(135deg, #2dd4bf, #14b8a6); color: #020617; }
        .badge-alumni     { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #020617; }

        /* Smooth scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Hover lift effect */
        .hover-lift {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .hover-lift:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(51, 119, 255, 0.15);
        }

        /* Nav link */
        .nav-link {
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }
        .nav-link:hover, .nav-link.active {
            background: rgba(51, 119, 255, 0.1);
            border-left-color: #3377ff;
            color: #3377ff;
        }

        /* Staggered animation delays */
        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .stagger-4 { animation-delay: 0.4s; }
        .stagger-5 { animation-delay: 0.5s; }

        /* Input styling */
        .input-glass {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .input-glass:focus {
            outline: none;
            border-color: #3377ff;
            box-shadow: 0 0 0 3px rgba(51, 119, 255, 0.15);
        }

        /* Button primary */
        .btn-primary {
            background: linear-gradient(135deg, #3377ff, #1b55f5);
            color: white;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-primary:hover {
            box-shadow: 0 8px 25px rgba(51, 119, 255, 0.35);
            transform: translateY(-1px);
        }
        .btn-primary:active { transform: translateY(0); }
    </style>
</head>
<body class="antialiased">
    <!-- Background Orbs -->
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <div class="relative z-10 flex min-h-screen">
        <!-- ═══ Sidebar ═══ -->
        <aside class="hidden lg:flex flex-col w-72 glass border-r border-white/5 p-6 fixed h-full">
            <!-- Logo -->
            <div class="flex items-center gap-3 mb-10">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center shadow-lg shadow-brand-500/20">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-brand-400 to-accent-teal bg-clip-text text-transparent">LinkIUT</h1>
                    <p class="text-[10px] text-surface-200/50 tracking-widest uppercase">Alumni Hub</p>
                </div>
            </div>

            <!-- Navigation -->
            <nav class="flex-1 space-y-1">
                <a href="/" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm text-surface-200 hover:text-brand-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" /></svg>
                    <span>Feed</span>
                </a>
                <a href="/messages" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm text-surface-200 hover:text-brand-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
                    <span>Messages</span>
                </a>
                <a th:href="@{/profile/{id}(id=${currentUser?.id ?: 1})}" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-sm text-surface-200 hover:text-brand-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                    <span>Profile</span>
                </a>
            </nav>

            <!-- User Card -->
            <div th:if="${currentUser}" class="glass-light rounded-xl p-4 mt-auto">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-br from-brand-500 to-accent-teal flex items-center justify-center text-sm font-bold text-white">
                        <span th:text="${currentUser.initials}">FR</span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-semibold truncate" th:text="${currentUser.displayName}">User</p>
                        <span class="inline-block text-[10px] px-2 py-0.5 rounded-full font-semibold mt-0.5"
                              th:classappend="${currentUser.role.name() == 'ALUMNI' ? 'badge-alumni' : 'badge-student'}"
                              th:text="${currentUser.role}">ROLE</span>
                    </div>
                    <a href="/logout" class="text-surface-200/40 hover:text-accent-rose transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                    </a>
                </div>
            </div>
        </aside>

        <!-- ═══ Mobile Header ═══ -->
        <header class="lg:hidden fixed top-0 left-0 right-0 z-50 glass border-b border-white/5 px-4 py-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center">
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
                        </svg>
                    </div>
                    <span class="text-lg font-bold bg-gradient-to-r from-brand-400 to-accent-teal bg-clip-text text-transparent">LinkIUT</span>
                </div>
                <nav class="flex items-center gap-4">
                    <a href="/" class="text-surface-200/60 hover:text-brand-400 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" /></svg>
                    </a>
                    <a href="/messages" class="text-surface-200/60 hover:text-brand-400 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
                    </a>
                    <a th:href="@{/profile/{id}(id=${currentUser?.id ?: 1})}" class="text-surface-200/60 hover:text-brand-400 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                    </a>
                </nav>
            </div>
        </header>

        <!-- ═══ Main Content ═══ -->
        <main class="flex-1 lg:ml-72 pt-16 lg:pt-0">
            <div layout:fragment="content" class="p-6 lg:p-10">
                <!-- Page content injected here -->
            </div>
        </main>
    </div>
</body>
</html>
