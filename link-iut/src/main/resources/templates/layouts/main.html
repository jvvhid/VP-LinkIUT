<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title layout:title-pattern="$CONTENT_TITLE — LinkIUT">LinkIUT</title>
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <!-- SockJS and STOMP for WebSockets -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anybody:wght@700;800&family=Hanken+Grotesk:wght@400&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-surface-variant": "#57423e",
                      "on-primary-fixed": "#3f0300",
                      "primary-fixed-dim": "#ffb4a6",
                      "secondary-fixed-dim": "#c1c8ca",
                      "surface-container-highest": "#e3e2e1",
                      "primary-container": "#8e2d1d",
                      "on-background": "#1a1c1c",
                      "on-tertiary-fixed-variant": "#3e484c",
                      "outline": "#8a716d",
                      "surface-tint": "#a33c2b",
                      "primary": "#6e1609",
                      "inverse-on-surface": "#f1f0f0",
                      "error-container": "#ffdad6",
                      "tertiary-fixed": "#d9e4e9",
                      "surface-container-low": "#f4f3f2",
                      "on-secondary": "#ffffff",
                      "surface-container-lowest": "#ffffff",
                      "tertiary": "#2f393d",
                      "on-tertiary": "#ffffff",
                      "inverse-surface": "#2f3130",
                      "secondary": "#586062",
                      "background": "#faf9f8",
                      "surface-bright": "#faf9f8",
                      "surface-dim": "#dadad9",
                      "on-secondary-container": "#5d6466",
                      "tertiary-container": "#455054",
                      "on-primary": "#ffffff",
                      "on-secondary-fixed-variant": "#41484a",
                      "on-surface": "#1a1c1c",
                      "inverse-primary": "#ffb4a6",
                      "error": "#ba1a1a",
                      "surface-container-high": "#e9e8e7",
                      "on-primary-container": "#ffab9c",
                      "secondary-container": "#dae1e3",
                      "on-secondary-fixed": "#161d1f",
                      "outline-variant": "#dec0ba",
                      "on-primary-fixed-variant": "#832516",
                      "on-error-container": "#93000a",
                      "on-tertiary-container": "#b7c2c6",
                      "surface-variant": "#e3e2e1",
                      "surface-container": "#eeeeed",
                      "surface": "#faf9f8",
                      "on-tertiary-fixed": "#131d21",
                      "on-error": "#ffffff",
                      "secondary-fixed": "#dde4e6",
                      "tertiary-fixed-dim": "#bdc8cd",
                      "primary-fixed": "#ffdad4"
              },
              "borderRadius": {
                      "DEFAULT": "0px",
                      "lg": "0px",
                      "xl": "0px",
                      "full": "0px"
              },
              "spacing": {
                      "unit": "8px",
                      "border-width": "3px",
                      "margin-desktop": "64px",
                      "gutter": "24px",
                      "isometric-depth": "4px",
                      "margin-mobile": "20px"
              },
              "fontFamily": {
                      "label-md": ["JetBrains Mono"],
                      "body-md": ["Hanken Grotesk"],
                      "headline-sm": ["Anybody"],
                      "headline-md": ["Anybody"],
                      "headline-xl": ["Anybody"],
                      "headline-lg": ["Anybody"],
                      "headline-xl-mobile": ["Anybody"],
                      "body-lg": ["Hanken Grotesk"]
              },
              "fontSize": {
                      "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                      "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                      "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "700" }],
                      "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                      "headline-xl": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                      "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                      "headline-xl-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "800" }],
                      "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
              }
            }
          }
        }
    </script>
    <style>
        .shadow-isometric { box-shadow: 4px 4px 0px 0px rgba(26, 28, 28, 1); }
        .hover-isometric { transition: transform 0.2s, box-shadow 0.2s; }
        .hover-isometric:hover { transform: translate(4px, 4px); box-shadow: none; }
        
        /* Badge colors */
        .badge-job        { background: var(--tw-colors-secondary); color: white; }
        .badge-internship { background: var(--tw-colors-tertiary); color: white; }
        .badge-mentorship { background: var(--tw-colors-primary-container); color: white; }
        .badge-student    { background: var(--tw-colors-tertiary); color: white; }
        .badge-alumni     { background: var(--tw-colors-primary); color: white; }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col md:flex-row">
    
    <!-- TopNavBar (Mobile Only) -->
    <header class="bg-surface text-primary font-headline-md text-headline-md docked full-width top-0 border-b-[3px] border-on-surface shadow-[4px_4px_0px_0px_rgba(26,28,28,1)] flex justify-between items-center w-full px-5 h-[72px] z-50 md:hidden sticky">
        <div class="text-headline-md font-headline-md font-extrabold text-primary tracking-tighter">LINKIUT</div>
        <div class="flex gap-4">
            <span class="material-symbols-outlined text-primary cursor-pointer hover:translate-x-[2px] hover:translate-y-[2px] transition-all">notifications</span>
            <span class="material-symbols-outlined text-primary cursor-pointer hover:translate-x-[2px] hover:translate-y-[2px] transition-all">person_search</span>
        </div>
    </header>

    <!-- SideNavBar (Desktop) -->
    <nav class="bg-surface-container-low text-primary font-label-md text-label-md docked left-0 h-screen w-64 border-r-[3px] border-on-surface fixed left-0 top-0 h-full hidden md:flex flex-col z-40">
        <div class="p-6 border-b-[3px] border-on-surface">
            <h1 class="font-headline-sm text-primary">IUT ALUMNI</h1>
            <p class="font-body-md text-on-surface-variant">Modular Network</p>
        </div>
        <div class="flex flex-col gap-2 p-4 flex-1">
            <a th:href="@{/}" class="flex items-center gap-3 p-3 transition-colors text-on-surface-variant hover:bg-surface-variant hover:bg-surface-container-high">
                <span class="material-symbols-outlined">dynamic_feed</span> Feed
            </a>
            <a th:href="@{/network}" class="flex items-center gap-3 p-3 text-on-surface-variant hover:bg-surface-variant hover:bg-surface-container-high transition-colors">
                <span class="material-symbols-outlined">group</span> IUT Network
            </a>
            <a th:href="@{/messages}" class="flex items-center gap-3 p-3 text-on-surface-variant hover:bg-surface-variant hover:bg-surface-container-high transition-colors">
                <span class="material-symbols-outlined">forum</span> Messages
            </a>
            <a th:href="@{/profile/{id}(id=${currentUser?.id ?: 1})}" class="flex items-center gap-3 p-3 text-on-surface-variant hover:bg-surface-variant hover:bg-surface-container-high transition-colors">
                <span class="material-symbols-outlined">person</span> Profile
            </a>
            <a th:if="${currentUser != null && currentUser.role.name() == 'ALUMNI'}" th:href="@{/profile/{id}#opportunities(id=${currentUser.id})}" class="flex items-center gap-3 p-3 text-on-surface-variant hover:bg-surface-variant hover:bg-surface-container-high transition-colors">
                <span class="material-symbols-outlined">work</span> Posted Opportunities
            </a>
        </div>
        
        <div class="p-4 border-t-[3px] border-on-surface" th:if="${currentUser != null}">
            <!-- User Card -->
            <div class="flex items-center gap-3 p-3 mb-4 border-[3px] border-on-surface bg-surface shadow-isometric">
                <div class="w-10 h-10 bg-primary flex items-center justify-center text-sm font-bold text-on-primary border-[3px] border-on-surface">
                    <span th:text="${currentUser.initials}">FR</span>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="font-headline-sm text-[16px] truncate" th:text="${currentUser.displayName}">User</p>
                    <p class="font-label-md text-on-surface-variant truncate" th:text="${currentUser.role}">ROLE</p>
                </div>
            </div>
            
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="w-full flex items-center gap-3 p-3 text-on-surface-variant hover:bg-surface-variant hover:bg-surface-container-high transition-colors">
                    <span class="material-symbols-outlined">logout</span> Logout
                </button>
            </form>
        </div>
    </nav>

    <!-- Main Content Canvas -->
    <main class="flex-1 md:ml-64 p-5 md:p-[64px] bg-background min-h-screen">
        <div layout:fragment="content">
            <!-- Page content injected here -->
        </div>
    </main>

    <!-- Background Pattern -->
    <div class="fixed inset-0 opacity-10 pointer-events-none -z-10" style="background-image: repeating-linear-gradient(45deg, #1a1c1c 0, #1a1c1c 2px, transparent 2px, transparent 10px);"></div>
</body>
</html>
