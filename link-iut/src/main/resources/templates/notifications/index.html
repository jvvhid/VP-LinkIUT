<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/main}">

<head>
    <title>Notifications</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="max-w-2xl mx-auto space-y-6 animate-fade-in-up">
            
            <div class="flex items-center justify-between border-b-[3px] border-on-surface pb-4">
                <h1 class="font-headline-lg text-on-surface uppercase">Notifications</h1>
            </div>
            
            <div th:if="${notifications == null || notifications.isEmpty()}" 
                 class="p-8 border-[3px] border-on-surface border-dashed bg-surface text-center">
                <span class="material-symbols-outlined text-4xl text-on-surface-variant mb-2">notifications_off</span>
                <p class="font-body-md text-on-surface-variant">You're all caught up!</p>
            </div>
            
            <div class="space-y-4">
                <th:block th:each="notification : ${notifications}">
                    <a th:href="${notification.link}" 
                       class="block p-4 border-[3px] border-on-surface bg-surface hover-isometric shadow-isometric"
                       th:classappend="${!notification.read ? 'bg-surface-container-highest border-primary' : ''}">
                        
                        <div class="flex gap-4">
                            <div class="w-12 h-12 shrink-0 bg-primary flex items-center justify-center text-sm font-bold text-on-primary border-[3px] border-on-surface overflow-hidden">
                                <img th:if="${notification.actor.avatarUrl != null}" th:src="${notification.actor.avatarUrl}" class="w-full h-full object-cover">
                                <span th:if="${notification.actor.avatarUrl == null}" th:text="${notification.actor.initials}">FR</span>
                            </div>
                            <div class="flex-1">
                                <p class="font-body-md text-on-surface">
                                    <span class="font-bold" th:text="${notification.actor.displayName}">Name</span>
                                    <span th:text="${notification.message.substring(notification.actor.displayName.length() + 1)}">acted on something.</span>
                                </p>
                                <p class="font-label-sm text-on-surface-variant mt-1" 
                                   th:text="${#temporals.format(notification.createdAt, 'MMM dd, h:mm a')}">Jan 1, 12:00 PM</p>
                            </div>
                            <div th:if="${!notification.read}" class="w-3 h-3 bg-primary rounded-full mt-2"></div>
                        </div>
                    </a>
                </th:block>
            </div>
            
        </div>
    </div>
</body>

</html>
