<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — LinkIUT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        brand: { 400: '#599dff', 500: '#3377ff', 600: '#1b55f5', 700: '#1440e1' },
                        surface: { 800: '#0f172a', 900: '#020617' },
                        accent: { teal: '#2dd4bf', violet: '#a78bfa' }
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Inter', system-ui, sans-serif; }
        body { background: #020617; }
        .bg-orb { position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.12; pointer-events: none; }
        .bg-orb-1 { width: 500px; height: 500px; background: #3377ff; top: -15%; left: -10%; animation: drift1 20s ease-in-out infinite; }
        .bg-orb-2 { width: 400px; height: 400px; background: #2dd4bf; bottom: -10%; right: -5%; animation: drift2 25s ease-in-out infinite; }
        @keyframes drift1 { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(60px,40px); } }
        @keyframes drift2 { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(-50px,-40px); } }
        @keyframes fadeInUp { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 antialiased">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>

    <div class="relative z-10 w-full max-w-md" style="animation: fadeInUp 0.7s ease-out forwards">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-brand-500 to-brand-700 shadow-lg shadow-brand-500/25 mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
                </svg>
            </div>
            <h1 class="text-3xl font-bold bg-gradient-to-r from-brand-400 to-accent-teal bg-clip-text text-transparent">LinkIUT</h1>
            <p class="text-sm text-slate-400 mt-1">Alumni-Student Networking Hub</p>
        </div>

        <!-- Login Card -->
        <div class="backdrop-blur-xl bg-white/[0.04] border border-white/[0.06] rounded-2xl p-8 shadow-2xl">
            <!-- Error -->
            <div th:if="${param.error}" class="mb-5 px-4 py-3 rounded-xl bg-red-500/10 border border-red-500/20 text-sm text-red-400 flex items-center gap-2">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z" /></svg>
                Invalid email or password.
            </div>

            <!-- Logout -->
            <div th:if="${param.logout}" class="mb-5 px-4 py-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-sm text-emerald-400 flex items-center gap-2">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
                You have been signed out.
            </div>

            <!-- Registration success -->
            <div th:if="${param.registered}" class="mb-5 px-4 py-3 rounded-xl bg-brand-500/10 border border-brand-500/20 text-sm text-brand-400 flex items-center gap-2">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                Account created successfully! Sign in to get started.
            </div>

            <form th:action="@{/login}" method="post" class="space-y-5">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1.5" for="username">Email</label>
                    <input type="text" id="username" name="username" placeholder="alumni@iut.edu"
                           class="w-full bg-white/[0.03] border border-white/[0.08] rounded-xl px-4 py-3 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all" required>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1.5" for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••"
                           class="w-full bg-white/[0.03] border border-white/[0.08] rounded-xl px-4 py-3 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all" required>
                </div>
                <button type="submit" id="login-submit"
                        class="w-full bg-gradient-to-r from-brand-500 to-brand-600 text-white py-3 rounded-xl font-semibold text-sm hover:shadow-lg hover:shadow-brand-500/30 hover:-translate-y-0.5 active:translate-y-0 transition-all">
                    Sign In
                </button>
            </form>

            <!-- Demo credentials -->
            <div class="mt-6 pt-5 border-t border-white/[0.06]">
                <p class="text-xs text-slate-500 text-center mb-3">Demo Accounts</p>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="document.getElementById('username').value='alumni@iut.edu'; document.getElementById('password').value='password';"
                            class="text-xs px-3 py-2.5 rounded-lg bg-amber-500/10 border border-amber-500/15 text-amber-400 hover:bg-amber-500/15 transition-colors text-center cursor-pointer">
                        🎓 Alumni
                    </button>
                    <button onclick="document.getElementById('username').value='student@iut.edu'; document.getElementById('password').value='password';"
                            class="text-xs px-3 py-2.5 rounded-lg bg-teal-500/10 border border-teal-500/15 text-teal-400 hover:bg-teal-500/15 transition-colors text-center cursor-pointer">
                        📚 Student
                    </button>
                </div>
            </div>

            <!-- Sign up link -->
            <div class="mt-5 pt-5 border-t border-white/[0.06] text-center">
                <p class="text-sm text-slate-500">Don't have an account?
                    <a href="/register" class="text-brand-400 hover:text-brand-300 font-medium transition-colors">Create one</a>
                </p>
            </div>
        </div>

        <p class="text-center text-xs text-slate-600 mt-6">IUT Dhaka — Islamic University of Technology</p>
    </div>
</body>
</html>
