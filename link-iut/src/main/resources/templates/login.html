<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — LinkIUT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anybody:wght@700;800&family=Hanken+Grotesk:wght@400&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: { 
                        'headline-lg': ['Anybody', 'sans-serif'], 
                        'headline-md': ['Anybody', 'sans-serif'], 
                        'headline-sm': ['Anybody', 'sans-serif'],
                        'body-md': ['Hanken Grotesk', 'sans-serif'],
                        'body-sm': ['Hanken Grotesk', 'sans-serif'],
                        'label-md': ['JetBrains Mono', 'monospace']
                    },
                    colors: {
                        "primary": "var(--color-primary)",
                        "on-primary": "var(--color-on-primary)",
                        "primary-container": "var(--color-primary-container)",
                        "on-primary-container": "var(--color-on-primary-container)",
                        "secondary": "var(--color-secondary)",
                        "on-secondary": "var(--color-on-secondary)",
                        "tertiary": "var(--color-tertiary)",
                        "on-tertiary": "var(--color-on-tertiary)",
                        "background": "var(--color-background)",
                        "on-background": "var(--color-on-background)",
                        "surface": "var(--color-surface)",
                        "on-surface": "var(--color-on-surface)",
                        "surface-variant": "var(--color-surface-variant)",
                        "on-surface-variant": "var(--color-on-surface-variant)",
                        "surface-container-low": "var(--color-surface-container-low)",
                        "surface-container-highest": "var(--color-surface-container-highest)",
                        "error": "var(--color-error)",
                        "on-error": "var(--color-on-error)",
                        "error-container": "var(--color-error-container)",
                        "on-error-container": "var(--color-on-error-container)",
                    },
                    spacing: { 'gutter': '24px' },
                    boxShadow: { 'isometric': '4px 4px 0px 0px var(--color-on-surface)' }
                }
            }
        }
    </script>
    <style>
        /* Attractive Sophisticated Palette */
        :root {
            --color-background: #F4F1EA;
            --color-on-background: #2C3E50;
            --color-surface: #FFFFFF;
            --color-on-surface: #2C3E50;
            --color-primary: #D35400;
            --color-on-primary: #FFFFFF;
            --color-primary-container: #E67E22;
            --color-on-primary-container: #FFFFFF;
            --color-secondary: #2C3E50;
            --color-on-secondary: #FFFFFF;
            --color-tertiary: #16A085;
            --color-on-tertiary: #FFFFFF;
            --color-surface-variant: #EAE6DF;
            --color-on-surface-variant: #5A6D7C;
            --color-surface-container-low: #F9F8F6;
            --color-surface-container-highest: #D5D0C5;
            --color-error: #C0392B;
            --color-on-error: #FFFFFF;
            --color-error-container: #F2D7D5;
            --color-on-error-container: #641E16;
        }
        .dark {
            --color-background: #000000;
            --color-on-background: #FFFFFF;
            --color-surface: #000000;
            --color-on-surface: #FFFFFF;
            --color-primary: #E67E22;
            --color-on-primary: #000000;
            --color-primary-container: #000000;
            --color-on-primary-container: #E67E22;
            --color-secondary: #000000;
            --color-on-secondary: #FFFFFF;
            --color-tertiary: #1ABC9C;
            --color-on-tertiary: #000000;
            --color-surface-variant: #000000;
            --color-on-surface-variant: #A4B0BE;
            --color-surface-container-low: #000000;
            --color-surface-container-highest: #111111;
            --color-error: #E74C3C;
            --color-on-error: #000000;
            --color-error-container: #000000;
            --color-on-error-container: #E74C3C;
        }

        * { font-family: 'Hanken Grotesk', sans-serif; }
        h1, h2, h3, h4, h5, h6, .font-headline-lg, .font-headline-md, .font-headline-sm {
            font-family: 'Anybody', sans-serif;
            font-weight: 800;
        }
        .font-label-md {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
        }
        body { background: var(--color-background); color: var(--color-on-background); }
        .hover-isometric { transition: transform 0.1s ease-in-out, box-shadow 0.1s ease-in-out; }
        .hover-isometric:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0px 0px var(--color-on-surface); cursor: pointer; }
        .hover-isometric:active { transform: translate(4px, 4px); box-shadow: none; }
        @keyframes fade-in-up { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-up { animation: fade-in-up 0.4s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center py-10 px-4 antialiased overflow-y-auto bg-background text-on-background">
    <!-- Main Content Wrapper -->
    <div id="main-content" class="w-full max-w-md mx-auto">
        <!-- Logo -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 border-[3px] border-on-surface bg-primary shadow-isometric mb-3">
                <span class="material-symbols-outlined text-3xl text-on-primary font-bold">link</span>
            </div>
            <h1 class="text-3xl font-headline-lg text-on-surface tracking-tighter">LINKIUT</h1>
            <p class="text-xs font-label-md text-on-surface-variant uppercase mt-1">Alumni-Student Networking Hub</p>
        </div>

        <!-- Login Section -->
        <div class="border-[3px] border-on-surface shadow-isometric bg-surface p-8 flex flex-col hover-isometric transition-transform animate-fade-in-up">
            
            <!-- Error -->
            <div th:if="${param.error}" class="mb-6 p-4 border-[3px] border-on-surface bg-error-container text-on-error-container font-body-md font-bold flex items-center gap-2">
                <span class="material-symbols-outlined">error</span>
                Invalid email or password.
            </div>

            <!-- Logout -->
            <div th:if="${param.logout}" class="mb-6 p-4 border-[3px] border-on-surface bg-primary-container text-on-primary-container font-body-md font-bold flex items-center gap-2">
                <span class="material-symbols-outlined">logout</span>
                You have been signed out.
            </div>

            <!-- Registration success -->
            <div th:if="${param.registered}" class="mb-6 p-4 border-[3px] border-on-surface bg-secondary text-on-secondary font-body-md font-bold flex items-center gap-2">
                <span class="material-symbols-outlined">check_circle</span>
                Account created successfully! Sign in.
            </div>

            <form th:action="@{/login}" method="post" class="space-y-6">
                <div>
                    <label class="block font-label-md text-on-surface uppercase mb-2" for="username">Email</label>
                    <input type="text" id="username" name="username" placeholder="alumni@iut.edu"
                           class="w-full bg-surface-container-low border-[3px] border-on-surface p-3 font-body-md text-on-surface focus:outline-none focus:border-primary" required>
                </div>
                <div>
                    <label class="block font-label-md text-on-surface uppercase mb-2" for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••"
                           class="w-full bg-surface-container-low border-[3px] border-on-surface p-3 font-body-md text-on-surface focus:outline-none focus:border-primary" required>
                </div>
                <button type="submit" id="login-submit"
                        class="w-full bg-primary text-on-primary font-headline-md uppercase border-[3px] border-on-surface py-3 shadow-isometric hover-isometric transition-all">
                    Sign In
                </button>
            </form>

            <!-- Demo credentials -->
            <div class="mt-8 pt-6 border-t-[3px] border-on-surface border-dotted">
                <p class="font-label-md text-on-surface-variant text-center mb-4 uppercase">Demo Accounts</p>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="document.getElementById('username').value='alumni@iut.edu'; document.getElementById('password').value='123456';"
                            class="font-label-md uppercase bg-secondary text-on-secondary border-[3px] border-on-surface py-2 shadow-isometric hover-isometric transition-all text-center flex justify-center items-center gap-1">
                        <span class="material-symbols-outlined text-sm">school</span>
                        ALUMNI
                    </button>
                    <button onclick="document.getElementById('username').value='student@iut.edu'; document.getElementById('password').value='123456';"
                            class="font-label-md uppercase bg-tertiary text-on-tertiary border-[3px] border-on-surface py-2 shadow-isometric hover-isometric transition-all text-center flex justify-center items-center gap-1">
                        <span class="material-symbols-outlined text-sm">menu_book</span>
                        STUDENT
                    </button>
                </div>
            </div>

            <!-- Sign up link -->
            <div class="mt-6 pt-6 border-t-[3px] border-on-surface border-dotted text-center">
                <p class="font-body-md text-on-surface-variant">Don't have an account?
                    <a href="/register" class="text-primary font-bold hover:underline">Build one</a>
                </p>
            </div>
        </div>

        <p class="mt-8 text-center font-label-md text-on-surface-variant uppercase text-xs">IUT Dhaka — Islamic University of Technology</p>
    </div>


</body>
</html>
