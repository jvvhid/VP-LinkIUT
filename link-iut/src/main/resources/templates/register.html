<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — LinkIUT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        'headline-lg': ['Inter', 'sans-serif'], 
                        'headline-md': ['Inter', 'sans-serif'], 
                        'headline-sm': ['Inter', 'sans-serif'],
                        'body-md': ['Roboto', 'sans-serif'],
                        'body-sm': ['Roboto', 'sans-serif'],
                        'label-md': ['Inter', 'sans-serif']
                    },
                    colors: {
                        primary: '#FF5A5F',
                        'on-primary': '#FFFFFF',
                        'primary-container': '#FFD9DB',
                        'on-primary-container': '#410002',
                        secondary: '#00A699',
                        'on-secondary': '#FFFFFF',
                        tertiary: '#FC642D',
                        'on-tertiary': '#FFFFFF',
                        background: '#F7F7F9',
                        'on-background': '#1A1C1C',
                        surface: '#FFFFFF',
                        'on-surface': '#1A1C1C',
                        'surface-variant': '#E3E2E6',
                        'on-surface-variant': '#444749',
                        'surface-container-low': '#F3F3F6',
                        'surface-container-highest': '#E3E2E6',
                        error: '#BA1A1A',
                        'on-error': '#FFFFFF',
                        'error-container': '#FFDAD6',
                        'on-error-container': '#410002',
                    },
                    spacing: { 'gutter': '24px' },
                    boxShadow: { 'isometric': '4px 4px 0px 0px rgba(26,28,28,1)' }
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Roboto', sans-serif; }
        h1, h2, h3, h4, h5, h6, .font-headline-lg, .font-headline-md, .font-headline-sm, .font-label-md {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
        }
        body { background: #F7F7F9; color: #1A1C1C; }
        .hover-isometric { transition: transform 0.1s ease-in-out, box-shadow 0.1s ease-in-out; }
        .hover-isometric:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0px 0px rgba(26,28,28,1); cursor: pointer; }
        .hover-isometric:active { transform: translate(4px, 4px); box-shadow: none; }
        @keyframes fade-in-up { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-up { animation: fade-in-up 0.4s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 py-8 antialiased bg-[url('data:image/svg+xml,%3Csvg%20width%3D%2240%22%20height%3D%2240%22%20viewBox%3D%220%200%2040%2040%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Cpath%20d%3D%22M20%2020.5V18H0v-2h20v-2H0v-2h20v-2H0V8h20V6H0V4h20V2H0V0h22v20h2V0h2v20h2V0h2v20h2V0h2v20h2V0h2v20h2v2H20v-1.5zM0%2020h2v20H0V20zm4%200h2v20H4V20zm4%200h2v20H8V20zm4%200h2v20h-2V20zm4%200h2v20h-2V20zm4%204V20h20v2H20v2h20v2H20v2h20v2H20v2h20v2H20v2h20v2H20v2h20v2H20v-2z%22%20fill%3D%22%231a1c1c%22%20fill-opacity%3D%220.03%22%20fill-rule%3D%22evenodd%22%2F%3E%3C%2Fsvg%3E')] overflow-hidden">



    <!-- Main Content Wrapper -->
    <div id="main-content" class="w-full max-w-lg">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 border-[3px] border-on-surface bg-primary shadow-isometric mb-4">
                <span class="material-symbols-outlined text-4xl text-on-primary font-bold">link</span>
            </div>
            <h1 class="text-4xl font-headline-lg text-on-surface tracking-tighter">JOIN LINKIUT</h1>
            <p class="text-sm font-label-md text-on-surface-variant uppercase mt-2">Build your alumni-student networking account</p>
        </div>

        <!-- Registration Section -->
        <div class="bg-surface border-[3px] border-on-surface shadow-isometric p-8">
            <!-- Error -->
            <div th:if="${error}" class="mb-6 p-4 border-[3px] border-on-surface bg-error-container text-on-error-container font-body-md font-bold flex items-center gap-2">
                <span class="material-symbols-outlined">error</span>
                <span th:text="${error}">Error message</span>
            </div>

            <form th:action="@{/register}" method="post" class="space-y-4">
                <!-- Display Name -->
                <div>
                    <label class="block font-label-md text-on-surface uppercase mb-2" for="displayName">Full Name</label>
                    <input type="text" id="displayName" name="displayName" placeholder="Farhan Rahman"
                           class="w-full bg-surface-container-low border-[3px] border-on-surface p-3 font-body-md text-on-surface shadow-[inset_2px_2px_0px_0px_rgba(26,28,28,0.2)] focus:outline-none focus:border-primary" required>
                </div>

                <!-- Email -->
                <div>
                    <label class="block font-label-md text-on-surface uppercase mb-2" for="reg-email">Email</label>
                    <input type="email" id="reg-email" name="email" placeholder="you@iut.edu"
                           class="w-full bg-surface-container-low border-[3px] border-on-surface p-3 font-body-md text-on-surface shadow-[inset_2px_2px_0px_0px_rgba(26,28,28,0.2)] focus:outline-none focus:border-primary" required>
                </div>

                <!-- Role Selection -->
                <div>
                    <label class="block font-label-md text-on-surface uppercase mb-2">I am a...</label>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="cursor-pointer">
                            <input type="radio" name="role" value="STUDENT" class="peer sr-only" checked>
                            <div class="flex items-center justify-center gap-2 px-4 py-3 border-[3px] border-on-surface bg-surface text-on-surface font-label-md uppercase peer-checked:bg-tertiary peer-checked:text-on-tertiary peer-checked:shadow-[inset_4px_4px_0px_0px_rgba(26,28,28,0.4)] transition-all">
                                <span class="material-symbols-outlined text-sm">menu_book</span> Student
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="role" value="ALUMNI" class="peer sr-only">
                            <div class="flex items-center justify-center gap-2 px-4 py-3 border-[3px] border-on-surface bg-surface text-on-surface font-label-md uppercase peer-checked:bg-secondary peer-checked:text-on-secondary peer-checked:shadow-[inset_4px_4px_0px_0px_rgba(26,28,28,0.4)] transition-all">
                                <span class="material-symbols-outlined text-sm">school</span> Alumni
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Department & Batch row -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block font-label-md text-on-surface uppercase mb-2" for="department">Department</label>
                        <select id="department" name="department"
                                class="w-full bg-surface-container-low border-[3px] border-on-surface p-3 font-body-md text-on-surface shadow-[inset_2px_2px_0px_0px_rgba(26,28,28,0.2)] focus:outline-none focus:border-primary">
                            <option value="">Select...</option>
                            <option value="CSE">CSE</option>
                            <option value="EEE">EEE</option>
                            <option value="MCE">MCE</option>
                            <option value="CEE">CEE</option>
                            <option value="BTM">BTM</option>
                            <option value="TVE">TVE</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-label-md text-on-surface uppercase mb-2" for="batch">Batch</label>
                        <input type="text" id="batch" name="batch" placeholder="e.g. 2024"
                               class="w-full bg-surface-container-low border-[3px] border-on-surface p-3 font-body-md text-on-surface shadow-[inset_2px_2px_0px_0px_rgba(26,28,28,0.2)] focus:outline-none focus:border-primary">
                    </div>
                </div>

                <!-- Headline -->
                <div>
                    <label class="block font-label-md text-on-surface uppercase mb-2" for="headline">Headline <span class="font-body-md text-on-surface-variant normal-case">(optional)</span></label>
                    <input type="text" id="headline" name="headline" placeholder="e.g. Aspiring ML Engineer"
                           class="w-full bg-surface-container-low border-[3px] border-on-surface p-3 font-body-md text-on-surface shadow-[inset_2px_2px_0px_0px_rgba(26,28,28,0.2)] focus:outline-none focus:border-primary">
                </div>

                <!-- Password -->
                <div>
                    <label class="block font-label-md text-on-surface uppercase mb-2" for="reg-password">Password</label>
                    <input type="password" id="reg-password" name="password" placeholder="Min 6 characters"
                           class="w-full bg-surface-container-low border-[3px] border-on-surface p-3 font-body-md text-on-surface shadow-[inset_2px_2px_0px_0px_rgba(26,28,28,0.2)] focus:outline-none focus:border-primary" required minlength="6">
                </div>

                <!-- Confirm Password -->
                <div>
                    <label class="block font-label-md text-on-surface uppercase mb-2" for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••"
                           class="w-full bg-surface-container-low border-[3px] border-on-surface p-3 font-body-md text-on-surface shadow-[inset_2px_2px_0px_0px_rgba(26,28,28,0.2)] focus:outline-none focus:border-primary" required>
                </div>

                <button type="submit" id="register-submit"
                        class="w-full bg-primary text-on-primary font-headline-sm uppercase border-[3px] border-on-surface py-3 mt-4 shadow-isometric hover-isometric transition-all">
                    Create Account
                </button>
            </form>

            <!-- Sign in link -->
            <div class="mt-6 pt-6 border-t-[3px] border-on-surface border-dotted text-center">
                <p class="font-body-md text-on-surface-variant">Already have an account?
                    <a href="/login" class="text-primary font-bold hover:underline">Sign In</a>
                </p>
            </div>
        </div>

        <p class="text-center font-label-md text-on-surface-variant uppercase mt-8 text-xs">IUT Dhaka — Islamic University of Technology</p>
    </div>


</body>
</html>
