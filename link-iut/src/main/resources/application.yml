# Application
spring:
  application:
    name: LinkIUT

  # ── Datasource (H2 In-Memory with MySQL compatibility mode) ──────────
  datasource:
    url: jdbc:h2:mem:linkiut_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true

  # ── JPA ────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: true
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true

  # ── Schema init (disabled – DataLoader handles seeding) ────────
  sql:
    init:
      mode: never

  # ── Thymeleaf ──────────────────────────────────────────────────────
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  # ── Multipart Upload ───────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB

# ── Server ─────────────────────────────────────────────────────────
server:
  port: 8080

# ── Logging ────────────────────────────────────────────────────────
logging:
  level:
    edu.iutdhaka.linkiut: DEBUG
    org.springframework.security: WARN
