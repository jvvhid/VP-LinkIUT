# Application
spring:
  application:
    name: LinkIUT

  # ── H2 (dev default) ──────────────────────────────────────────────
  datasource:
    url: jdbc:h2:mem:linkiut_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  # ── To switch to PostgreSQL, comment out H2 above and uncomment: ─
  # datasource:
  #   url: jdbc:postgresql://localhost:5432/linkiut_db
  #   username: linkiut_user
  #   password: linkiut_pass
  #   driver-class-name: org.postgresql.Driver

  # ── JPA ────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: true
    properties:
      hibernate:
        format_sql: true

  # ── Schema init (disabled – DataLoader handles seeding) ────────
  sql:
    init:
      mode: never

    # ── File Upload ──────────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

  # ── Thymeleaf ──────────────────────────────────────────────────────
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

# ── Server ─────────────────────────────────────────────────────────
server:
  port: 8080

# ── Logging ────────────────────────────────────────────────────────
logging:
  level:
    edu.iutdhaka.linkiut: DEBUG
    org.springframework.security: WARN
