# Application
spring:
  application:
    name: LinkIUT

  # ── MySQL Datasource ───────────────────
  datasource:
    url: jdbc:mysql://localhost:3306/linkiut_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 1234
  h2:
    console:
      enabled: false

  # ── JPA ────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # ── Schema init (disabled – DataLoader handles seeding) ────────
  sql:
    init:
      mode: never

  # ── Thymeleaf ──────────────────────────────────────────────────────
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  # ── Multipart Upload ───────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB

# ── Server ─────────────────────────────────────────────────────────
server:
  port: 8080

# ── Logging ────────────────────────────────────────────────────────
logging:
  level:
    edu.iutdhaka.linkiut: DEBUG
    org.springframework.security: WARN
